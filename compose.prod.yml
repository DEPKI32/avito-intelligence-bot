services:
  bot:
    build: .
    env_file: .env
    environment:
      WEBAPP_HOST: 0.0.0.0
      WEBAPP_URL: https://${APP_DOMAIN:?Set APP_DOMAIN in .env}
    volumes:
      - ./data:/app/data
      - ./output:/app/output
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - from urllib.request import urlopen; assert urlopen('http://127.0.0.1:8080/healthz', timeout=5).status == 200
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 20s

  caddy:
    image: caddy:2
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN in .env}
    ports:
      - 80:80
      - 443:443
      - 443:443/udp
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      bot:
        condition: service_healthy
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
