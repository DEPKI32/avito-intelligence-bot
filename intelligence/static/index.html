<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f7fb" />
    <meta name="referrer" content="no-referrer" />
    <title>Avito Intelligence</title>
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />

    <link rel="stylesheet" href="/assets/app.css" />
    <script defer src="/assets/app.js"></script>
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand"><span class="brand-mark">A<span class="brand-dot">●</span></span><span class="brand-copy"><strong>avito<span>intelligence</span></strong><small>Ваш умный мониторинг</small></span></div>
        <div class="nav-caption">РАБОЧЕЕ ПРОСТРАНСТВО</div>
        <nav id="desktop-nav" class="side-nav" aria-label="Навигация"></nav>
        <div class="side-bottom"><div class="side-promo"><div class="spark">✦</div><strong>Находите лучшее первым</strong><p>Следите за ценами и открывайте выгодные предложения в одном месте.</p><button data-action="create" class="promo-button">Создать мониторинг <span>↗</span></button></div><div class="side-user"><div class="avatar">A</div><span><strong>Личный кабинет</strong><small>Telegram Mini App</small></span><span class="user-more">···</span></div></div>

      </div>
    </div>
    <nav id="mobile-nav" class="mobile-nav" aria-label="Мобильная навигация"></nav>
    <div id="overlay-root"></div>
    <div id="toast-root" aria-live="polite"></div>
