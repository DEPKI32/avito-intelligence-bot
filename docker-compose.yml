services:
  bot:
    build: .
    env_file: .env
    environment:
      WEBAPP_HOST: 0.0.0.0
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./data:/app/data
      - ./output:/app/output
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "uv", "run", "--frozen", "--no-dev", "python", "-c", "import sqlite3; sqlite3.connect('data/intelligence.sqlite3').execute('SELECT 1')"]
      interval: 1m
      timeout: 10s
      retries: 3
