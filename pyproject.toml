[project]
name = "avito-firewall-flow"
version = "0.2.0"
requires-python = ">=3.11"
dependencies = [
    "curl-cffi>=0.15.0",
    "openpyxl>=3.1.5",
    "questionary>=2.1.1",
    "aiogram>=3.20,<4",
    "sqlalchemy>=2.0,<3",
    "pydantic-settings>=2.0,<3",
    "pillow>=11,<13",
    "imagehash>=4.3,<5",
    "httpx>=0.27,<1",
    "tzdata>=2025.2 ; sys_platform == 'win32'",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.12"]

[project.optional-dependencies]
# Only the old main.py flow solves GeeTest; avito.py never does, so a
# normal install needs no git and no image/ML libraries.
captcha = [
    "ddddocr @ git+https://github.com/sml2h3/ddddocr.git@main",
    "numpy>=2.2.1",
    "opencv-python-headless>=4.10.0.84",
    "pycryptodome>=3.21.0",
    "requests>=2.32.3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
